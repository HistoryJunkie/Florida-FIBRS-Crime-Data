  }
  .page-title .titles{flex:1;min-width:0;}
  .page-title .about-link{

    color:var(--accent);
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:6px;
    white-space:nowrap;
  }
  .page-title .about-link:hover{

  }
  .page-title h1{
    font-size:clamp(15px,3.6vw,18px);

    margin:0 0 4px;
  }
  .page-title p{
    font-size:clamp(11px,2.6vw,12px);
    color:var(--muted);
    margin:0;
  }
  .content{
    max-width:820px;
    margin:0 auto;
  }
  .letter-group{
    scroll-margin-top:16px;
  }
  .letter-heading{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.06em;
    margin:28px 0 10px;
    padding-bottom:4px;
    border-bottom:1px solid var(--border);
  }
  .letter-group:first-child .letter-heading{margin-top:0;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:clamp(14px,3.5vw,24px) clamp(14px,4vw,28px) clamp(12px,3vw,20px);

    font-weight:600;
    margin:0 0 2px;
    color:var(--text);
  }
  .card .subtitle{
    font-size:clamp(10.5px,2.6vw,12px);
    color:var(--muted);
    margin:0 0 16px;
  }
  .graph{
    display:flex;
    gap:clamp(4px,1.5vw,10px);
  }
  .year-labels{
    display:flex;
    flex-direction:column;
    gap:clamp(2px,0.8vw,3px);
    padding-top:18px;

    height:clamp(18px,5.2vw,26px);

    color:var(--muted);
    text-align:right;
  }
  .grid-wrap{
    flex:1;
    min-width:0;
  }
  .month-row{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    font-size:clamp(8px,2.2vw,11px);
    color:var(--muted);
    margin-bottom:4px;
  }
  .month-row div{text-align:center;}
  .row{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:clamp(1.5px,0.6vw,3px);
    margin-bottom:clamp(1.5px,0.6vw,3px);
  }
  .cell{
    height:clamp(18px,5.2vw,26px);
    border-radius:3px;
    background:var(--l0);
    border:1px solid rgba(255,255,255,0.04);
    position:relative;
    cursor:default;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(7px,2vw,10px);
    font-variant-numeric:tabular-nums;
    color:rgba(255,255,255,0.85);
  }
  .cell.l1{background:var(--l1);}
  .cell.l2{background:var(--l2);}
  .cell.l3{background:var(--l3);}
  .cell.l4{background:var(--l4);}
  .cell.na{
    background:repeating-linear-gradient(
      45deg,
      var(--na-stripe),
      var(--na-stripe) 3px,
      #1b1f26 3px,
      #1b1f26 6px
    );
    color:var(--muted);
    font-size:9px;
  }
  .cell:hover::after{
    content:attr(data-tip);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%);
    background:#1c2128;
    border:1px solid var(--border);
    color:var(--text);
    padding:5px 8px;
    font-size:11px;
    white-space:nowrap;
    border-radius:4px;
    z-index:10;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    font-size:11px;
    color:var(--muted);
  }
  .legend{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .legend .cell{height:11px;width:11px;border-radius:2px;}
  .totals{
    margin-top:18px;
    border-top:1px solid var(--border);
    padding-top:12px;
    font-size:12px;
    color:var(--muted);
  }
  .totals span{color:var(--text);font-weight:600;}

  .alpha-nav{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    width:clamp(34px,7vw,48px);

  .alpha-nav button{

    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:default;
    transition:background 0.12s ease,color 0.12s ease;
  }
  .alpha-nav button.active{
    color:var(--muted);

  }
  .alpha-nav button.active:hover{

  }
  .alpha-nav button.active:active{

  }
  .alpha-nav button.current{

    background:rgba(88,166,255,0.12);
  }

</style>

// Every agency has been required to submit FIBRS data since the 2021 transition.
// Fill any year missing from the source with a fully "not submitted" row so all
// cards span the same 2021-2026 range. A reported value of 0 is treated the
// same as no data, since visually a zero-offense month should look the same
// as a not-submitted month.
const agencies = {};
Object.entries(rawAgencies).forEach(([name, yearData]) => {
  agencies[name] = {};
  ALL_YEARS.forEach(y => {
    const months12 = yearData[y];
    agencies[name][y] = months12 ? months12.map(v => (v === 0 ? null : v)) : new Array(12).fill(MISSING_YEAR);
  });
});

function levelFor(v, min, max){
  if(v === null || v === MISSING_YEAR) return 'na';
  const range = max - min || 1;
  const pct = (v - min) / range;
  if(pct < 0.25) return 'l1';
  if(pct < 0.5) return 'l2';
  if(pct < 0.75) return 'l3';
  return 'l4';
}

const cardsEl = document.getElementById('cards');
const sortedNames = Object.keys(agencies).sort();

// group by first letter for the sticky alphabet nav / section headings
const lettersPresent = new Set(sortedNames.map(n => n[0].toUpperCase()));
let currentLetter = null;

sortedNames.forEach(agencyName => {
  const data = agencies[agencyName];
  const firstLetter = agencyName[0].toUpperCase();

  let groupEl;
  if(firstLetter !== currentLetter){
    currentLetter = firstLetter;
    groupEl = document.createElement('div');
    groupEl.className = 'letter-group';
    groupEl.id = 'letter-' + firstLetter;
    const heading = document.createElement('div');
    heading.className = 'letter-heading';
    heading.textContent = firstLetter;
    groupEl.appendChild(heading);
    cardsEl.appendChild(groupEl);
  } else {
    groupEl = cardsEl.lastElementChild;
  }

  const years = Object.keys(data).sort();
  const yearRange = `${years[0]}-${years[years.length - 1]}`;
  const allValues = years.flatMap(y => data[y]).filter(v => v !== null && v !== MISSING_YEAR);
  const max = allValues.length ? Math.max(...allValues) : 0;
  const min = allValues.length ? Math.min(...allValues) : 0;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>${agencyName}</h2>
    <p class="subtitle">Monthly FIBRS offense submissions, ${yearRange}</p>
    <div class="graph">
      <div class="year-labels"></div>
      <div class="grid-wrap">
        <div class="month-row"></div>
        <div class="rows"></div>
      </div>
    </div>
    <div class="footer">
      <div>Striped = agency didn't submit that year, or no offenses reported / not yet posted</div>
      <div class="legend">
        Less
        <div class="cell l1"></div>
        <div class="cell l2"></div>
        <div class="cell l3"></div>
        <div class="cell l4"></div>
        More
      </div>
    </div>
    <div class="totals"></div>
  `;
  groupEl.appendChild(card);

  const monthRow = card.querySelector('.month-row');
  months.forEach(m => {
    const d = document.createElement('div');
    d.textContent = m;
    monthRow.appendChild(d);
  });

  const yearLabels = card.querySelector('.year-labels');
  const rows = card.querySelector('.rows');

  years.forEach(year => {
    const yl = document.createElement('div');
    yl.textContent = year;
    yearLabels.appendChild(yl);

    const row = document.createElement('div');
    row.className = 'row';
    data[year].forEach((v, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell ' + levelFor(v, min, max);
      cell.textContent = (v === null || v === MISSING_YEAR) ? '-' : v;
      let tip;
      if(v === MISSING_YEAR){
        tip = `${months[i]} ${year}: agency did not submit FIBRS data this year`;
      } else if(v === null){
        tip = `${months[i]} ${year}: no offenses reported`;
      } else {
        tip = `${months[i]} ${year}: ${v} offense${v === 1 ? '' : 's'} reported`;
      }
      cell.setAttribute('data-tip', tip);
      row.appendChild(cell);
    });
    rows.appendChild(row);
  });

  const totalsEl = card.querySelector('.totals');
  totalsEl.innerHTML = years.map(y => {
    const monthVals = data[y];
    if(monthVals.every(v => v === MISSING_YEAR)){
      return `${y}: <span>not submitted</span>`;
    }
    const sum = monthVals.filter(v => v !== null && v !== MISSING_YEAR).reduce((a,b) => a+b, 0);
    const complete = monthVals.every(v => v !== null && v !== MISSING_YEAR);
    return `${y}: <span>${sum.toLocaleString()}</span>${complete ? '' : ' (partial year)'}`;
  }).join(' - ');
});

// build sticky A-Z nav
const alphaNav = document.getElementById('alphaNav');
const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
alphabet.forEach(letter => {
  const btn = document.createElement('button');
  btn.textContent = letter;
  if(lettersPresent.has(letter)){
    btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.getElementById('letter-' + letter).scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
  alphaNav.appendChild(btn);
});

// highlight current section on scroll
const groups = Array.from(document.querySelectorAll('.letter-group'));
function updateCurrent(){
  let current = groups[0];
  for(const g of groups){
    if(g.getBoundingClientRect().top <= 80){
      current = g;
    } else {
      break;
    }
  }
  const letter = current.id.replace('letter-', '');
  alphaNav.querySelectorAll('button').forEach(b => b.classList.remove('current'));
  const btnIndex = alphabet.indexOf(letter);
  if(btnIndex >= 0){
    alphaNav.children[btnIndex].classList.add('current');
  }
}
document.addEventListener('scroll', updateCurrent, {passive:true});
updateCurrent();
